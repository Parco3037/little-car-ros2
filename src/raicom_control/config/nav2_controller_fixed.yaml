# Fixed-route baseline candidate; physical acceptance pending.
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odom
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.02
      movement_time_allowance: 30.0
    goal_checker_plugins:
    - general_goal_checker
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.17453292519943295
    controller_plugins:
    - FixedForward
    - FixedReverse
    FixedForward:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.25
      lookahead_dist: 0.12
      min_lookahead_dist: 0.08
      max_lookahead_dist: 0.25
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: false
      use_cost_regulated_linear_velocity_scaling: false
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.04
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.3
      rotate_to_heading_angular_vel: 0.25
      rotate_to_heading_min_angle: 0.15
      max_angular_accel: 0.7
      transform_tolerance: 0.2
      max_robot_pose_search_dist: 1.0
      use_interpolation: true
      use_rotate_to_heading: true
      allow_reversing: false
    FixedReverse:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.08
      lookahead_dist: 0.12
      min_lookahead_dist: 0.08
      max_lookahead_dist: 0.25
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: false
      use_cost_regulated_linear_velocity_scaling: false
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.04
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.3
      rotate_to_heading_angular_vel: 0.25
      rotate_to_heading_min_angle: 0.15
      max_angular_accel: 0.7
      transform_tolerance: 0.2
      max_robot_pose_search_dist: 1.0
      use_interpolation: true
      use_rotate_to_heading: false
      allow_reversing: true
