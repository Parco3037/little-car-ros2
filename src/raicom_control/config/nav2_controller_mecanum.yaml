# RAICOM controller matched to the EXISTING guard, not the vendor rotation shim.
# No motion acceptance implied. Use navigation_staging.launch.py for verification.
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odom
    # At 0.25 m/s, 10 Hz advances at most 2.5 cm per cycle (close to one 2 cm
    # map cell) while giving the Pi enough budget to meet the control loop.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.0872664626
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.25
      min_vel_y: -0.25
      max_vel_x: 0.25
      max_vel_y: 0.25
      max_vel_theta: 0.35
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.5
      acc_lim_theta: 0.7
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -0.7
      # The 7*7*11 profile still evaluated about 527 valid trajectories and
      # repeatedly missed the 10 Hz controller deadline on the loaded Pi.
      # 5*5*7=175 keeps zero plus symmetric holonomic/angular samples while
      # reducing the measured failure path's candidate budget by about 3x.
      vx_samples: 5
      vy_samples: 5
      vtheta_samples: 7
      sim_time: 1.5
      linear_granularity: 0.02
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      # The 2026-09-02 park_2 run used only distance critics away from the goal.
      # DWB therefore found a cheap trajectory that held -0.35 rad/s for about
      # 45 seconds while strafing, travelling roughly 2 m without converging.
      # Alignment critics make heading observable before RotateToGoal activates.
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, PathAlign, GoalAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 1.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
