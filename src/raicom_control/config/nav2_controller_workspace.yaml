# Local candidate; requires native/raicom_nav2_workspace. Not deployed or physically accepted.
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odom
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.005
      movement_time_allowance: 30.0
    general_goal_checker:
      plugin: raicom_nav2_workspace::SettledGoalChecker
      stateful: false
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.17453292519943295
    FollowPath:
      plugin: raicom_nav2_workspace::PhasedDwbController
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.25
      max_vel_y: 0.0
      max_vel_theta: 0.35
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 0.7
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -0.7
      vx_samples: 21
      vy_samples: 1
      vtheta_samples: 7
      sim_time: 1.5
      linear_granularity: 0.02
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.02
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      critics:
      - RotateToGoal
      - Oscillation
      - ObstacleFootprint
      - PathAlign
      - GoalAlign
      - PathDist
      - GoalDist
      ObstacleFootprint.scale: 1.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 128.0
      GoalDist.scale: 64.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      far_speed: 0.25
      near_speed: 0.12
      fine_speed: 0.03
      turn_speed: 0.35
      near_distance: 0.25
      fine_distance: 0.06
      validated_cap: 0.25
      RotateToGoal.class: raicom_nav2_workspace::UnifiedRotateToGoalCritic
