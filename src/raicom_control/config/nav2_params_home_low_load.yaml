# RAICOM home profile (legacy low_load filename retained for launch compatibility).
#
# This is a copied RAICOM profile; the vendor nav2_params.yaml under
# reference/lander_pi_source remains unchanged. On 2026-08-31 the user requested
# restoring 60 AMCL beams and vendor costmap update/publication rates while
# keeping 2 m sensing. This does not change
# saved-map pixels, MS200 hardware settings, guard limits or DWB frequency.
# 2026-08-31 navigation repair: 2 cm costmaps, shared stationary AMCL tuning,
# holonomic smoother bounded by the unchanged guard. Use navigation_staging
# with nav2_controller_mecanum.yaml; real footprint and motion acceptance pending.
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 4.0
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 2.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field_prob"
    max_beams: 60
    max_particles: 3000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.05
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.01
    update_min_d: 0.03
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: /scan
    set_initial_pose: False
    always_reset_initial_pose: True

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    # The 10 ms / 20 ms vendor desktop defaults made the Pi tick at 100 Hz
    # and declare already-accepted action/service requests timed out.  That
    # caused four recoveries in 1.38 s during the 2026-09-02 acceptance leg.
    bt_loop_duration: 100
    default_server_timeout: 1000
    #enable_groot_monitoring: True
    #groot_zmq_publisher_port: 1666
    #groot_zmq_server_port: 1667
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    default_nav_through_poses_bt_xml: "/home/ubuntu/ros2_ws/src/navigation/config/behavior_trees/navigate_without_backup.xml"
    # 为单点导航指定新的行为树
    default_nav_to_pose_bt_xml: "/home/ubuntu/ros2_ws/src/navigation/config/behavior_trees/navigate_to_pose_without_backup.xml"

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.02
      # Sixteen support lines conservatively enclose every original complete-model
      # vertex in the recorded stowed pose. This retains the real directional
      # shape instead of applying the 0.14659 m maximum radius in every direction.
      footprint: "[[0.14296083785510913,0.03260613944664631],[0.13897715487516482,0.04222360092502273],[0.09698724677910962,0.08421350902107795],[0.0908637816654062,0.0867499313198924],[-0.09182573318038617,0.0867499313198924],[-0.09794920670340834,0.08421350553782406],[-0.09873113857925613,0.08343157366197626],[-0.10319793224334715,0.0726477798178055],[-0.10319793224334718,-0.07264790559989655],[-0.09873119013434804,-0.08343157497906531],[-0.0979492613606915,-0.08421350375272184],[-0.09182578802487452,-0.08674992945724726],[0.09086379806615782,-0.08674992945724729],[0.09698723041242564,-0.08421352073114906],[0.1370018505511206,-0.04419890059245413],[0.14296083785510913,-0.029812632625155953]]"
      # The extra 4 cm arm reach is used only after parking and is not part of
      # the navigation footprint. Keep the separately requested 5 cm margin.
      footprint_padding: 0.05
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.8
        inflation_radius: 0.15
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.03
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

  local_costmap_client:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      footprint: "[[0.14296083785510913,0.03260613944664631],[0.13897715487516482,0.04222360092502273],[0.09698724677910962,0.08421350902107795],[0.0908637816654062,0.0867499313198924],[-0.09182573318038617,0.0867499313198924],[-0.09794920670340834,0.08421350553782406],[-0.09873113857925613,0.08343157366197626],[-0.10319793224334715,0.0726477798178055],[-0.10319793224334718,-0.07264790559989655],[-0.09873119013434804,-0.08343157497906531],[-0.0979492613606915,-0.08421350375272184],[-0.09182578802487452,-0.08674992945724726],[0.09086379806615782,-0.08674992945724729],[0.09698723041242564,-0.08421352073114906],[0.1370018505511206,-0.04419890059245413],[0.14296083785510913,-0.029812632625155953]]"
      resolution: 0.02
      footprint_padding: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.15
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False 
      
map_server:
  ros__parameters:
    use_sim_time: False
    #topic_name: map
    #frame_id: map
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.196
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

