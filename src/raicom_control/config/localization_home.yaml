# Stationary scan-correction profile; moving localization remains unaccepted.
# No automatic (0, 0, 0) pose: set the real initial pose in RViz after activation.
# BUG-006A: current /odom_raw is command-integrated odometry, not encoder
# feedback.  This profile must not be described as wheel-speed closed loop.
# The first production EKF profile must use only the selected real sources;
# no experimental secondary odometry, continuous fusion, or custom matcher.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    # G1 consumes the one formal scan adapter already owned by the base chain.
    # Do not start a second scan normalizer or create /scan_stable here.
    scan_topic: /scan
    map_topic: /map
    robot_model_type: nav2_amcl::OmniMotionModel
    set_initial_pose: false
    always_reset_initial_pose: true
    tf_broadcast: true
    transform_tolerance: 1.0
    alpha1: 4.0
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: likelihood_field_prob
    do_beamskip: false
    laser_min_range: 0.2
    laser_max_range: 2.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    sigma_hit: 0.05
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    update_min_a: 0.01
    update_min_d: 0.03

map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    topic_name: /map
    yaml_filename: ''  # Filled only after read-only YAML/PGM preflight.
