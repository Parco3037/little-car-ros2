# First production EKF profile for the existing LanderPi base.
# BUG-006A: /odom_raw is command-integrated odometry, not encoder feedback.
# Keep that limitation explicit; this profile is not wheel-speed closed loop.
# There is deliberately no secondary odometry input.  Experimental fusion
# and scan matching are not part of the production base chain.
/**:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 2.0
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.2
    print_diagnostics: false
    debug: false
    publish_acceleration: false
    permit_corrected_publication: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Existing odom_publisher output.  It is a known command-odometry
    # limitation pending a separately authorized motion-accuracy test.
    odom0: /odom_raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 1

    # Existing calibrated IMU stream.  No secondary odometry source is used.
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 4
    imu0_remove_gravitational_acceleration: false
